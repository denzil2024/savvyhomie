<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- Fonts are self-hosted (public/fonts/, @font-face in styles.css): no third-party
         CSS on the critical path, no extra connections. Preload only the two roman latin
         files every page uses above the fold; italic/latin-ext load on demand. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/fraunces-roman-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-tight-latin.woff2" crossorigin />
    <!--app-head-->
    <!-- Google tag (gtag.js) and Ahrefs analytics. Suppression, same pattern as ytgrowth's:
         two reasons NOT to record a visit —
           1. Non-production host: only savvyhomie.com / www.savvyhomie.com
              count as production, so localhost/dev/Railway preview traffic
              never pollutes real analytics.
           2. Owner opt-out: load any page once with ?sh_notrack=1 to stop
              your own visits being recorded on this browser; ?sh_track=1
              re-enables. Persists in localStorage, so it survives a dynamic
              IP (works from anywhere, including on the move) and works on
              every device you opt in on separately.
         window.__shTrack gates both GA (via ga-disable-*) and Ahrefs (by only
         injecting its script tag when __shTrack is true) off the same flag. -->
    <script>
      (function(){try{
        var h=location.hostname;
        var isProd=(h==='savvyhomie.com'||h==='www.savvyhomie.com');
        var p=new URLSearchParams(location.search);
        if(p.has('sh_notrack'))localStorage.setItem('sh_notrack','1');
        if(p.has('sh_track'))localStorage.removeItem('sh_notrack');
        var optedOut=localStorage.getItem('sh_notrack')==='1';
        window.__shTrack=(isProd&&!optedOut);
        if(!window.__shTrack){window['ga-disable-G-7ZWC1BW1J7']=true;}
      }catch(e){window.__shTrack=false;}})();
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-7ZWC1BW1J7');
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7ZWC1BW1J7"></script>
    <script>
      if (window.__shTrack) {
        var ahrefs = document.createElement('script');
        ahrefs.src = 'https://analytics.ahrefs.com/analytics.js';
        ahrefs.setAttribute('data-key', 'nu1o+Q9Js1e25W1P28jtdA');
        ahrefs.async = true;
        document.head.appendChild(ahrefs);
      }
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <!--app-data-->
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
