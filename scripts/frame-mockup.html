<!doctype html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #FAF8F4; font-family: sans-serif; padding: 40px; display: flex; flex-direction: column; gap: 50px; width: 760px; }
  .label { font-size: 14px; color: #6B6862; margin-bottom: 10px; font-weight: 600; }
  .photo-wrap { position: relative; width: 700px; aspect-ratio: 16/9; overflow: hidden; }
  .photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Option A: plain photo, no frame (current state) */
  /* Option B: inset gold keyline frame */
  .framed::after { content: ""; position: absolute; inset: 10px; border: 1px solid #C9A030; pointer-events: none; }
  /* Option C: frame + small corner logomark */
  .corner-mark { position: absolute; bottom: 22px; right: 22px; background: rgba(250,248,244,0.88); padding: 6px 12px; display: flex; align-items: center; gap: 6px; }
  .corner-mark img { height: 18px; width: auto; }
</style>
</head>
<body>
  <div>
    <div class="label">A — no frame (plain photo, current)</div>
    <div class="photo-wrap"><img src="../public/founder.jpg" /></div>
  </div>
  <div>
    <div class="label">B — thin gold keyline frame only</div>
    <div class="photo-wrap framed"><img src="../public/founder.jpg" /></div>
  </div>
  <div>
    <div class="label">C — gold frame + small logo mark, bottom-right corner</div>
    <div class="photo-wrap framed">
      <img src="../public/founder.jpg" />
      <div class="corner-mark"><img src="../public/logo-color.png" /></div>
    </div>
  </div>
</body>
</html>
