<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,500&family=Inter+Tight:wght@600&display=swap" />
<style>
  :root {
    --paper: #FAF8F4;
    --ink: #14130F;
    --gold: #C9A030;
    --butter-line: #E4D6AE;
    --spruce: #1D5235;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    background: var(--paper);
    font-family: 'Inter Tight', sans-serif;
    overflow: hidden;
  }
  .frame {
    position: absolute;
    inset: 36px;
    border: 1px solid var(--butter-line);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .plate {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }
  .logo {
    height: 84px;
  }
  .orn {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .rule {
    width: 64px;
    height: 1px;
    background: var(--gold);
  }
  .diamond {
    width: 8px;
    height: 8px;
    background: var(--gold);
    transform: rotate(45deg);
  }
  .tagline {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 27px;
    color: var(--spruce);
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="plate">
      <img class="logo" src="../public/logo-color.png" />
      <div class="orn"><div class="rule"></div><div class="diamond"></div><div class="rule"></div></div>
      <div class="tagline">Thoughtful tips and finds for a home you love.</div>
    </div>
  </div>
</body>
</html>
